name: iOS startup diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_DEMO_ONLY: 'true'
  EAS_BUILD_PROFILE: demo
  EXPO_USE_PRECOMPILED_MODULES: '0'
jobs:
  startup:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'
          package-manager-cache: false
      - run: npm ci
      - run: npx --no-install expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Build Release for simulator
        run: |
          mkdir -p diagnostic
          set -o pipefail
          xcodebuild -workspace ios/RandomStranger.xcworkspace -scheme RandomStranger -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > diagnostic/build.log 2>&1
      - name: Launch and verify process survives
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > diagnostic/devices.json
          UDID=$(python3 -c 'import json;d=json.load(open("diagnostic/devices.json"));print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"] and x["isAvailable"]))')
          echo "$UDID" > diagnostic/udid
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/simulator/Build/Products/Release-iphonesimulator/RandomStranger.app
          plutil -p "$APP/Info.plist" > diagnostic/info-plist.txt
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" it.randomstranger.app | tee diagnostic/launch.txt
          sleep 15
          PID=$(awk '{print $NF}' diagnostic/launch.txt)
          kill -0 "$PID"
          xcrun simctl io "$UDID" screenshot diagnostic/startup.png
      - name: Collect startup logs
        if: always()
        run: |
          mkdir -p diagnostic
          if [ -f diagnostic/udid ]; then
            UDID=$(cat diagnostic/udid)
            xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "RandomStranger" OR eventMessage CONTAINS "it.randomstranger.app"' > diagnostic/runtime.log 2>&1 || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -name '*RandomStranger*' -type f -exec cp {} diagnostic/ \; 2>/dev/null || true
          tail -100 diagnostic/build.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-startup-diagnostic
          path: diagnostic/
          retention-days: 3
